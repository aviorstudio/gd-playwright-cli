name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
        - patch
        - minor
        - major
concurrency: release-${{ github.repository }}
jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@a1c0321f3b4917a7e99eca42e241e46670f6e1e1
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Check project
      shell: bash
      run: |-
        set -euo pipefail
        mise run check
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  release:
    name: Release
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Determine release version
      id: release
      env:
        TARGET: cli
        BUMP: ${{ inputs.bump }}
      run: |
        set -euo pipefail
        test "$GITHUB_REF" = refs/heads/main || { echo 'Run releases from main.' >&2; exit 1; }
        case "$TARGET" in gd) prefix=gd-v ;; cli) prefix=cli-v ;; *) exit 1 ;; esac
        git fetch --tags --force
        latest="$(git tag --list "${prefix}[0-9]*" | sed -E "s/^${prefix}//" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
        test -n "$latest" || latest=0.0.7
        IFS=. read -r major minor patch <<< "$latest"
        case "$BUMP" in
          major) major=$((major + 1)); minor=0; patch=0 ;;
          minor) minor=$((minor + 1)); patch=0 ;;
          patch) patch=$((patch + 1)) ;;
          *) exit 1 ;;
        esac
        version="$major.$minor.$patch"
        tag="$prefix$version"
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "Release tag already exists; refusing to replace it." >&2
          exit 1
        fi
        printf 'version=%s\ntag=%s\ndate=%s\n' "$version" "$tag" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      date: ${{ steps.release.outputs.date }}
  build-cli:
    name: Build native CLI
    needs:
    - release
    uses: ./.github/workflows/cli-native.yml
    permissions:
      contents: read
    with:
      release: true
      version: ${{ needs.release.outputs.version }}
  accept-cli:
    name: Accept CLI release archives
    needs: build-cli
    permissions:
      contents: read
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: native-cli-*
        merge-multiple: true
        path: dist
    - name: Require all six platforms and record checksums
      run: |
        set -euo pipefail
        cd dist
        for platform in Linux Darwin Windows; do
          extension=tar.gz
          [ "$platform" != Windows ] || extension=zip
          for arch in x86_64 arm64; do
            test -s "gd-playwright-cli_${platform}_${arch}.${extension}"
          done
        done
        test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
        sha256sum ./*.tar.gz ./*.zip > checksums.txt
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: dist/*
    - name: Upload artifacts
      id: accepted
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: accepted-cli-${{ github.sha }}-${{ github.run_attempt }}
        path: dist/*
        if-no-files-found: error
        retention-days: 7
    outputs:
      artifact-id: ${{ steps.accepted.outputs.artifact-id }}
  publish-cli:
    name: Publish release
    needs:
    - release
    - accept-cli
    uses: nicodes/tools/.github/workflows/cli-publish.yml@a1c0321f3b4917a7e99eca42e241e46670f6e1e1
    permissions:
      contents: write
    with:
      tools-ref: f412061a7a3f0914db9e09d1159e69504aee8706
      binary: gd-playwright-cli
      tag: ${{ needs.release.outputs.tag }}
      artifact-id: ${{ needs.accept-cli.outputs.artifact-id }}
