[tools]
python = "3.13.11"
rust = "1.94.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[env]
TOOLS_ROOT = "{{ get_env(name='TOOLS_ROOT', default=config_root ~ '/.ci-tools') }}"
PYTHONDONTWRITEBYTECODE = "1"

[tasks.install]
run = "rustup component add --toolchain 1.94.0 rustfmt clippy"
[tasks.lint]
run = "bash scripts/check.sh lint"
[tasks.build]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" build --name build --artifact .artifacts/bin -- mise run _build"
depends = ["install"]
[tasks.unit]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" test --name unit --artifact .artifacts/bin -- mise run _unit"
depends = ["install"]
[tasks.artifact-check]
run = "python3 -c 'from pathlib import Path; import os; p=Path(\".artifacts/bin/gd-playwright-cli\"); assert p.is_file() and p.stat().st_size and os.access(p,os.X_OK)'"
depends = ["build"]
[tasks.clean]
run = "python3 \"$TOOLS_ROOT/helpers/clean.py\" --path target --path dist --path .artifacts/bin"
[tasks._build]
run = "bash scripts/check.sh build"
hide = true
[tasks._unit]
run = "bash scripts/check.sh test"
hide = true
[tasks._test-stages]
run = [{task = "unit"}]
hide = true
[tasks.test]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" session --test unit -- mise run _test-stages"
[tasks._check-stages]
run = [{task = "install"}, {task = "lint"}, {task = "build"}, {task = "unit"}, {task = "artifact-check"}]
hide = true
[tasks.check]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" session --test unit -- mise run _check-stages"
